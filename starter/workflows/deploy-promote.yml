# staging 에는 Actions에서 만든 이미지를 배포하고, production 에는 staging 에서 확인한 그 이미지를 다시 빌드하지 않고 그대로 배포(승격)한다.
# 사용법: deploy-image.yml 로 바꾼 .github/workflows/deploy.yml 을 이 파일의 내용으로 바꾼다(테스트, 환경, 승인 구조는 그대로).
#   필요한 Variables 는 deploy-image.yml 과 같다(AR_REPO 포함). staging 서비스 이름은 아래 STAGING_SERVICE 에 적는다.
# 배포용 이미지는 staging 브랜치에서만 만든다. main 에서는 이미지를 만들지 않는다.
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGING_SERVICE: friend-agent-staging
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # staging 브랜치: 이미지를 만들어 커밋 SHA 태그로 올린다
      - name: 이미지 만들기와 올리기 (staging)
        if: github.ref_name != 'main'
        run: |
          IMAGE="${{ vars.AR_REPO }}/friend-agent:${{ github.sha }}"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"

      # main 브랜치: staging 에서 트래픽을 가장 많이 받는 리비전의 이미지(다이제스트)와 커밋을 찾는다
      - name: staging 이미지 찾기 (production 승격)
        if: github.ref_name == 'main'
        run: |
          REV=$(gcloud run services describe "$STAGING_SERVICE" --region us-central1 --project ${{ vars.GCP_PROJECT_ID }} --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          gcloud run revisions describe "$REV" --region us-central1 --project ${{ vars.GCP_PROJECT_ID }} --format json > rev.json
          IMAGE=$(jq -r '.status.imageDigest' rev.json)
          COMMIT=$(jq -r '.spec.containers[0].env[] | select(.name=="COMMIT_SHA") | .value' rev.json)
          echo "staging 리비전 $REV 의 이미지를 승격한다: $IMAGE (커밋 $COMMIT)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE }}
          env_vars: |
            COMMIT_SHA=${{ env.COMMIT }}
            ENV=${{ vars.ENV }}
          flags: --service-account=${{ vars.RUNTIME_SA }}

      - name: 배포 결과
        run: |
          echo "배포된 주소 ${{ steps.deploy.outputs.url }}"
          echo "배포한 이미지 $IMAGE"
          echo "이미지의 커밋 $COMMIT"
